server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: preparation-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: preparation
  flyway:
    schemas:
      - preparation
    default-schema: preparation

  jackson:
    serialization:
      write-dates-as-timestamps: false

aws:
  region: ${AWS_REGION:ap-southeast-1}
  endpoint: ${AWS_ENDPOINT:}
  access-key: ${AWS_ACCESS_KEY:test}
  secret-key: ${AWS_SECRET_KEY:test}
  sns:
    preparation-events-topic-arn: ${SNS_PREPARATION_EVENTS_TOPIC_ARN:arn:aws:sns:ap-southeast-1:000000000000:preparation-events}
  sqs:
    preparation-from-ordering-queue-url: ${SQS_PREPARATION_FROM_ORDERING_QUEUE_URL:http://localhost:4566/000000000000/preparation-from-ordering}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
