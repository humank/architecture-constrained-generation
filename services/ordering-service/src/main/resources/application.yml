server:
  port: 8081
  shutdown: graceful

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  application:
    name: ordering-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ordering
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas:
      - ordering
    locations:
      - classpath:db/migration

app:
  messaging:
    sns:
      ordering-events-topic-arn: ${SNS_ORDERING_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:ordering-events}
    sqs:
      ordering-from-preparation-queue-url: ${SQS_ORDERING_FROM_PREPARATION_QUEUE_URL:http://localhost:4566/000000000000/ordering-from-preparation}
      poll-interval-ms: ${SQS_POLL_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
