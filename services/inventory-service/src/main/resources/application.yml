server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
    open-in-view: false
  flyway:
    enabled: true
    schemas: inventory
    default-schema: inventory
  jackson:
    serialization:
      write-dates-as-timestamps: false

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}
  access-key: ${AWS_ACCESS_KEY:localstack}
  secret-key: ${AWS_SECRET_KEY:localstack}
  sns:
    inventory-events-topic-arn: ${AWS_SNS_INVENTORY_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:inventory-events}
  sqs:
    inventory-from-preparation-queue-url: ${AWS_SQS_INVENTORY_FROM_PREPARATION_QUEUE_URL:http://localhost:4566/000000000000/inventory-from-preparation}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
