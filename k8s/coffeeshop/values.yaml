global:
  namespace: staging
  image:
    registry: "{account}.dkr.ecr.ap-east-2.amazonaws.com"
  aws:
    region: ap-east-2
  db:
    host: coffeeshop-staging-db.cluster-xxxx.ap-east-2.rds.amazonaws.com
    port: 5432
    name: coffeeshop
  spring:
    profiles: staging

services:
  ordering:
    name: ordering-service
    image:
      repository: coffeeshop/ordering-service
      tag: latest
    replicas: 1
    port: 8081
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: ordering-service
    schema: ordering
    env:
      SNS_TOPIC_ARN: arn:aws:sns:ap-east-2:{account}:coffeeshop-staging-ordering-events
      SQS_QUEUE_URL: https://sqs.ap-east-2.amazonaws.com/{account}/coffeeshop-staging-ordering-from-preparation
    healthCheck:
      path: /actuator/health

  preparation:
    name: preparation-service
    image:
      repository: coffeeshop/preparation-service
      tag: latest
    replicas: 1
    port: 8082
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: preparation-service
    schema: preparation
    env:
      SNS_TOPIC_ARN: arn:aws:sns:ap-east-2:{account}:coffeeshop-staging-preparation-events
      SQS_QUEUE_URL: https://sqs.ap-east-2.amazonaws.com/{account}/coffeeshop-staging-preparation-from-ordering
    healthCheck:
      path: /actuator/health

  inventory:
    name: inventory-service
    image:
      repository: coffeeshop/inventory-service
      tag: latest
    replicas: 1
    port: 8083
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: inventory-service
    schema: inventory
    env:
      SNS_TOPIC_ARN: arn:aws:sns:ap-east-2:{account}:coffeeshop-staging-inventory-events
      SQS_QUEUE_URL: https://sqs.ap-east-2.amazonaws.com/{account}/coffeeshop-staging-inventory-from-preparation
    healthCheck:
      path: /actuator/health

  reporting:
    name: reporting-service
    image:
      repository: coffeeshop/reporting-service
      tag: latest
    replicas: 1
    port: 8084
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: reporting-service
    schema: reporting
    env:
      SQS_REPORTING_ORDERING_URL: https://sqs.ap-east-2.amazonaws.com/{account}/coffeeshop-staging-reporting-from-ordering
      SQS_REPORTING_INVENTORY_URL: https://sqs.ap-east-2.amazonaws.com/{account}/coffeeshop-staging-reporting-from-inventory
    healthCheck:
      path: /actuator/health

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/wafv2-acl-arn: ""

hpa:
  ordering:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
