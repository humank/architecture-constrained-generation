global:
  namespace: staging
  image:
    registry: "584518143473.dkr.ecr.us-east-1.amazonaws.com"
  aws:
    region: us-east-1
  db:
    host: coffeeshop-staging-db.cjsrdxz2uhxg.us-east-1.rds.amazonaws.com
    port: 5432
    name: coffeeshop
  spring:
    profiles: staging

services:
  ordering:
    name: ordering-service
    image:
      repository: coffeeshop-staging/ordering-service
      tag: latest
    replicas: 1
    port: 8081
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: ordering-service
    schema: ordering
    env:
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:584518143473:coffeeshop-staging-ordering-events
      SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/584518143473/coffeeshop-staging-ordering-from-preparation
    healthCheck:
      path: /actuator/health

  preparation:
    name: preparation-service
    image:
      repository: coffeeshop-staging/preparation-service
      tag: latest
    replicas: 1
    port: 8082
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: preparation-service
    schema: preparation
    env:
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:584518143473:coffeeshop-staging-preparation-events
      SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/584518143473/coffeeshop-staging-preparation-from-ordering
    healthCheck:
      path: /actuator/health

  inventory:
    name: inventory-service
    image:
      repository: coffeeshop-staging/inventory-service
      tag: latest
    replicas: 1
    port: 8083
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: inventory-service
    schema: inventory
    env:
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:584518143473:coffeeshop-staging-inventory-events
      SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/584518143473/coffeeshop-staging-inventory-from-preparation
    healthCheck:
      path: /actuator/health

  reporting:
    name: reporting-service
    image:
      repository: coffeeshop-staging/reporting-service
      tag: latest
    replicas: 1
    port: 8084
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    serviceAccount: reporting-service
    schema: reporting
    env:
      SQS_REPORTING_ORDERING_URL: https://sqs.us-east-1.amazonaws.com/584518143473/coffeeshop-staging-reporting-from-ordering
      SQS_REPORTING_INVENTORY_URL: https://sqs.us-east-1.amazonaws.com/584518143473/coffeeshop-staging-reporting-from-inventory
    healthCheck:
      path: /actuator/health

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health

hpa:
  ordering:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  preparation:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
  inventory:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
